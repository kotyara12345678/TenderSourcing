name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            dockerfile: deploy/docker/Dockerfile.rust
            build_args: PACKAGE=tender-api
          - name: orchestrator
            dockerfile: deploy/docker/Dockerfile.rust
            build_args: PACKAGE=tender-orchestrator
          - name: search
            dockerfile: deploy/docker/Dockerfile.rust
            build_args: PACKAGE=tender-search
          - name: matching
            dockerfile: deploy/docker/Dockerfile.rust
            build_args: PACKAGE=tender-matching
          - name: document-worker
            dockerfile: deploy/docker/Dockerfile.worker
            build_args: SERVICE=document_worker
          - name: ai-worker
            dockerfile: deploy/docker/Dockerfile.worker
            build_args: SERVICE=ai_worker
          - name: report-worker
            dockerfile: deploy/docker/Dockerfile.worker
            build_args: SERVICE=report_worker
          - name: frontend
            dockerfile: deploy/docker/Dockerfile.frontend
            build_args: VITE_API_BASE_URL=/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image.name }}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.build_args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
