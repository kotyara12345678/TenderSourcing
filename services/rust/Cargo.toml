[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/api",
    "crates/orchestrator",
    "crates/search",
    "crates/matching",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# internal
tender-common = { path = "crates/common" }

# grpc / protobuf (tonic 0.14+ splits codegen into tonic-prost-build)
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"

# async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"

# http api (api-gateway)
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "compression-gzip"] }

# data
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# auth / hashing
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# errors / logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# outbound http (Keenable, LLM)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }

# misc
dotenvy = "0.15"
